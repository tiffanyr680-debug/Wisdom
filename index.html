<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WisdomVault | Tiffany's Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;900&family=Crimson+Pro:italic,wght@600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        .quote-serif { font-family: 'Crimson Pro', serif; }
        
        /* Clean Top Navigation */
        .nav-bar { background-color: #1e1b4b; border-bottom: 1px solid #2d2a5d; height: 70px; display: flex; align-items: center; padding: 0 40px; position: sticky; top: 0; z-index: 100; }
        
        /* Fixed Search Box */
        .search-box { background: #0f172a !important; border: 1px solid #334155 !important; border-radius: 8px; padding: 10px 15px; color: white !important; width: 300px; outline: none !important; }
        .search-box:focus { border-color: #6366f1 !important; }

        /* Author Grid */
        .author-grid { column-count: 4; column-gap: 20px; }
        .author-item { color: #818cf8; font-size: 14px; margin-bottom: 8px; cursor: pointer; display: block; width: fit-content; }
        .author-item:hover { color: white; text-decoration: underline; }

        /* General Card */
        .box-panel { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 30px; margin-bottom: 30px; }
        
        .btn-add { background: #6366f1; color: white; padding: 10px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; border: none; font-size: 14px; }
        .btn-add:hover { background: #4f46e5; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION -->
    <nav class="nav-bar">
        <div class="flex-1 flex items-center gap-12">
            <h1 onclick="location.reload()" class="text-2xl font-black italic tracking-tighter cursor-pointer">WISDOM<span class="text-indigo-400 font-extrabold">VAULT</span></h1>
            <div class="flex gap-6 text-[10px] font-black uppercase tracking-widest text-slate-400">
                <span class="text-white cursor-pointer">Authors</span>
                <span class="hover:text-white cursor-pointer">Topics</span>
                <span class="hover:text-white cursor-pointer">My Collection</span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <input type="text" id="searchInput" onkeyup="doSearch()" placeholder="Search vault..." class="search-box">
            <button onclick="showModal(true)" class="btn-add">+ ADD NEW</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-10">

        <!-- AUTHOR DIRECTORY -->
        <div class="box-panel">
            <h2 class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-8 pb-4 border-b border-white/5">Explore Quotes by Famous Authors</h2>
            <div class="author-grid" id="authorList">
                <!-- Authors injected here -->
            </div>
        </div>

        <!-- USER COLLECTION -->
        <div class="box-panel">
            <h2 class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-8">My Private Wisdom Collection</h2>
            <div id="userQuotes" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- User quotes injected here -->
            </div>
        </div>

    </main>

    <!-- ADD MODAL -->
    <div id="modalOverlay" class="hidden fixed inset-0 z-[200] bg-black/90 flex items-center justify-center p-6 backdrop-blur-sm">
        <div class="bg-[#0f172a] border border-white/10 p-12 rounded-2xl max-w-lg w-full shadow-2xl">
            <h2 class="text-2xl font-black mb-8 italic">CAPTURE NEW WISDOM</h2>
            <div class="space-y-4">
                <textarea id="inText" placeholder="Quote text..." class="w-full bg-black/50 border border-white/5 p-4 rounded-lg text-white outline-none h-32"></textarea>
                <input id="inAuthor" type="text" placeholder="Author" class="w-full bg-black/50 border border-white/5 p-3 rounded-lg text-white">
                <div class="flex gap-4 pt-6">
                    <button onclick="showModal(false)" class="flex-1 py-3 text-slate-500 font-bold">Cancel</button>
                    <button onclick="saveNew()" class="flex-1 bg-indigo-600 py-3 rounded-lg font-bold text-white uppercase text-xs">Save Wisdom</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data
        const famousAuthors = [
            'Adam Sandler', 'Albert Einstein', 'Aristotle', 'Barack Obama', 'Benjamin Franklin', 
            'Bill Gates', 'Bruce Lee', 'Buddha', 'Carl Jung', 'Cristiano Ronaldo', 'Dalai Lama', 
            'Drake', 'Elon Musk', 'Ernest Hemingway', 'Helen Keller', 'Jesus Christ', 'John F. Kennedy', 
            'LeBron James', 'Leonardo da Vinci', 'Marcus Aurelius', 'Marilyn Monroe', 'Martin Luther King Jr.', 
            'Maya Angelou', 'Michael Jordan', 'Nelson Mandela', 'Oscar Wilde', 'Robert Frost', 'Rumi', 
            'Socrates', 'Steve Jobs', 'Taylor Swift', 'Warren Buffett', 'Winston Churchill'
        ];

        let myDb = JSON.parse(localStorage.getItem('tiffany_vault_final')) || [
            { text: "Your income is a mirror of your self-worth.", author: "Arlan Hamilton" },
            { text: "Everything is figureoutable.", author: "Marie Forleo" }
        ];

        // Functions
        function init() {
            renderAuthors(famousAuthors);
            renderUserQuotes(myDb);
        }

        function renderAuthors(list) {
            const div = document.getElementById('authorList');
            div.innerHTML = list.map(a => `<span class="author-item" onclick="setSearch('${a}')">${a}</span>`).join('');
        }

        function renderUserQuotes(data) {
            const div = document.getElementById('userQuotes');
            div.innerHTML = data.map((q, i) => `
                <div class="bg-white/5 p-8 rounded-xl border border-white/5 relative group">
                    <p class="quote-serif text-2xl italic text-slate-100 mb-6">"${q.text}"</p>
                    <div class="flex justify-between items-center">
                        <span class="text-indigo-400 font-bold text-sm uppercase tracking-widest">${q.author}</span>
                        <button onclick="remove(${i})" class="text-slate-800 hover:text-rose-500 font-bold">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function doSearch() {
            const val = document.getElementById('searchInput').value.toLowerCase();
            const filteredAuthors = famousAuthors.filter(a => a.toLowerCase().includes(val));
            const filteredUser = myDb.filter(q => q.text.toLowerCase().includes(val) || q.author.toLowerCase().includes(val));
            renderAuthors(filteredAuthors);
            renderUserQuotes(filteredUser);
        }

        function setSearch(name) {
            document.getElementById('searchInput').value = name;
            doSearch();
        }

        function showModal(show) {
            document.getElementById('modalOverlay').classList.toggle('hidden', !show);
        }

        function saveNew() {
            const t = document.getElementById('inText').value;
            const a = document.getElementById('inAuthor').value;
            if(!t) return;
            myDb.unshift({ text: t, author: a || 'Unknown' });
            localStorage.setItem('tiffany_vault_final', JSON.stringify(myDb));
            showModal(false);
            renderUserQuotes(myDb);
            document.getElementById('inText').value = '';
            document.getElementById('inAuthor').value = '';
        }

        function remove(idx) {
            if(confirm('Delete?')) {
                myDb.splice(idx, 1);
                localStorage.setItem('tiffany_vault_final', JSON.stringify(myDb));
                renderUserQuotes(myDb);
            }
        }

        init();
    </script>
</body>
</html>
