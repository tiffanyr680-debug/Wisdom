<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WisdomVault | Tiffany's Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Crimson+Pro:italic,wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; }
        /* BrainyQuote Header Style */
        .master-nav { background-color: #1e1b4b; height: 60px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .sub-nav { background-color: #0f172a; border-bottom: 1px solid rgba(255,255,255,0.05); }
        /* Card Style from Image */
        .quote-card { background: rgba(30, 41, 59, 0.4); border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; position: relative; }
        .quote-card:hover { transform: translateY(-3px); border-color: #6366f1; }
        .quote-serif { font-family: 'Crimson Pro', serif; }
        /* Search Box */
        .search-input { background: #020617 !important; border: 1px solid #1e293b !important; border-radius: 4px; padding: 6px 12px; color: white !important; font-size: 14px; outline: none; }
        .hidden { display: none !important; }
        .nav-link { font-size: 14px; font-weight: 600; color: #cbd5e1; transition: 0.2s; }
        .nav-link:hover { color: white; }
    </style>
</head>
<body>

    <!-- TOP MASTER NAV (Tier 1) -->
    <nav class="master-nav px-8">
        <div class="max-w-7xl mx-auto w-full flex justify-between items-center">
            <div class="flex items-center gap-10">
                <h1 onclick="location.reload()" class="text-xl font-black italic tracking-tighter cursor-pointer">WISDOM<span class="text-indigo-500">VAULT</span></h1>
                <div class="hidden lg:flex gap-8">
                    <a href="#" class="nav-link">Home</a>
                    <a href="#" class="nav-link">Authors</a>
                    <a href="#" class="nav-link">Topics</a>
                    <a href="#" class="nav-link">Daily Wisdom</a>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <input type="text" id="searchInput" onkeyup="smartSearch()" placeholder="search" class="search-input w-48">
                <button class="bg-indigo-600 px-3 py-1 rounded text-white font-bold">🔍</button>
            </div>
        </div>
    </nav>

    <!-- SUB NAV (Tier 2) -->
    <div class="sub-nav py-3 px-8">
        <div class="max-w-7xl mx-auto w-full flex justify-between items-center">
            <h2 class="text-xs font-bold uppercase tracking-widest text-slate-400" id="topicLabel">Public Domain Quotes</h2>
            <div class="flex gap-6 text-[10px] font-bold text-slate-500 uppercase tracking-widest">
                <button onclick="filterByTopic('Success')" class="hover:text-white transition-all">Popular Topics</button>
                <button onclick="filterByTopic('Mindset')" class="hover:text-white transition-all">Popular Authors</button>
                <button onclick="document.getElementById('addModal').classList.remove('hidden')" class="text-indigo-400">+ Add New</button>
            </div>
        </div>
    </div>

    <!-- MAIN GRID -->
    <main class="max-w-7xl mx-auto py-12 px-8">
        <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards injected here -->
        </div>
    </main>

    <!-- MODAL: ADD QUOTE -->
    <div id="addModal" class="hidden fixed inset-0 z-[100] bg-black/95 flex items-center justify-center p-6 backdrop-blur-xl">
        <div class="bg-slate-900 p-10 rounded-2xl border border-white/10 max-w-lg w-full">
            <h2 class="text-2xl font-black mb-8 text-white">ADD NEW WISDOM</h2>
            <div class="space-y-4">
                <textarea id="inQuote" placeholder="The Quote..." class="w-full bg-black/50 border border-white/5 p-4 rounded-xl text-white outline-none h-32"></textarea>
                <input id="inAuthor" type="text" placeholder="Author" class="w-full bg-black/50 border border-white/5 p-4 rounded-xl text-white">
                <input id="inTopic" type="text" placeholder="Topic (e.g. Success)" class="w-full bg-black/50 border border-white/5 p-4 rounded-xl text-white">
                <div class="flex gap-4 pt-6">
                    <button onclick="document.getElementById('addModal').classList.add('hidden')" class="flex-1 py-4 text-slate-500 font-bold uppercase text-[10px]">Cancel</button>
                    <button onclick="addNew()" class="flex-1 bg-indigo-600 py-4 rounded-xl font-black uppercase text-xs">Save to Vault</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Real-World Style Data
        let db = JSON.parse(localStorage.getItem('vault_v6')) || [
            { text: "Your income is a mirror of your self-worth.", author: "Arlan Hamilton", topic: "Mindset" },
            { text: "Everything is figureoutable.", author: "Marie Forleo", topic: "Strategy" },
            { text: "Success is not final, failure is not fatal.", author: "Winston Churchill", topic: "Success" },
            { text: "Once you thrust yourself out there, it's hard to retreat.", author: "Theo Epstein", topic: "Success" },
            { text: "You can't put the sign in a movie without paying.", author: "Dax Shepard", topic: "Strategy" },
            { text: "Lead by example, not by command.", author: "Marcus Aurelius", topic: "Leadership" }
        ];

        function render(items) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            items.forEach((q, i) => {
                grid.innerHTML += `
                    <div class="quote-card p-8 rounded-lg flex flex-col justify-between">
                        <div>
                            <p class="quote-serif text-lg leading-relaxed mb-6 text-slate-200">"${q.text}"</p>
                        </div>
                        <div class="flex justify-between items-end">
                            <div>
                                <p class="text-indigo-400 font-bold text-sm hover:underline cursor-pointer">${q.author}</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="del(${i})" class="text-slate-800 hover:text-rose-500 transition-colors text-lg">🗑️</button>
                                <span class="text-slate-600 text-lg">›</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function smartSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = db.filter(q => 
                q.text.toLowerCase().includes(query) || 
                q.author.toLowerCase().includes(query) || 
                q.topic.toLowerCase().includes(query)
            );
            render(filtered);
            document.getElementById('topicLabel').innerText = query ? `Search: ${query}` : "Public Domain Quotes";
        }

        function filterByTopic(top) {
            const filtered = db.filter(q => q.topic === top);
            render(filtered);
            document.getElementById('topicLabel').innerText = `${top} Quotes`;
        }

        function addNew() {
            const t = document.getElementById('inQuote').value;
            const a = document.getElementById('inAuthor').value;
            const tp = document.getElementById('inTopic').value;
            if(!t) return;
            db.unshift({ text: t, author: a, topic: tp });
            localStorage.setItem('vault_v6', JSON.stringify(db));
            document.getElementById('addModal').classList.add('hidden');
            render(db);
        }

        function del(idx) {
            if(confirm('Delete?')) {
                db.splice(idx, 1);
                localStorage.setItem('vault_v6', JSON.stringify(db));
                render(db);
            }
        }

        // Initialize
        render(db);
    </script>
</body>
</html>
