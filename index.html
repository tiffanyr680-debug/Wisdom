<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WisdomVault | Tiffany's Intelligence HQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Crimson+Pro:italic,wght@600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; }
        .quote-card { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(12px); }
        .quote-serif { font-family: 'Crimson Pro', serif; }
        /* High-Visibility Search Box */
        .master-search { 
            width: 100%; 
            background: #0f172a !important; 
            border: 2px solid #1e293b !important; 
            border-radius: 1rem; 
            padding: 1.5rem; 
            font-size: 1.5rem; 
            color: white !important; 
            outline: none !important;
            position: relative;
            z-index: 50;
        }
        .master-search:focus { border-color: #6366f1 !important; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="p-8 md:p-16">

    <div class="max-w-5xl mx-auto">
        
        <header class="flex justify-between items-center mb-12">
            <h1 class="text-3xl font-black italic tracking-tighter uppercase">WISDOM<span class="text-indigo-500">VAULT</span></h1>
            <button onclick="document.getElementById('addModal').classList.remove('hidden')" class="bg-indigo-600 px-6 py-2 rounded-xl font-bold text-xs uppercase tracking-widest">+ Add New</button>
        </header>

        <!-- SMART SEARCH BOX -->
        <div class="mb-12 relative">
            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-[0.3em] mb-3 ml-2">Smart Intelligence Search</label>
            <input type="text" id="searchInput" onkeyup="smartSearch()" placeholder="Search by Author, Quote, or Topic (e.g. Mindset)..." class="master-search">
        </div>

        <!-- RESULTS INFO -->
        <div id="statusInfo" class="mb-6 text-xs font-bold text-slate-500 uppercase tracking-widest ml-2">
            Showing all wisdom
        </div>

        <!-- GRID -->
        <div id="grid" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Cards injected here -->
        </div>

    </div>

    <!-- ADD MODAL -->
    <div id="addModal" class="hidden fixed inset-0 z-[100] bg-black/95 flex items-center justify-center p-6">
        <div class="bg-slate-900 p-10 rounded-[3rem] border border-white/10 max-w-lg w-full">
            <h2 class="text-2xl font-black mb-8 text-white uppercase italic">Add Wisdom</h2>
            <div class="space-y-4">
                <textarea id="inQuote" placeholder="The Wisdom..." class="w-full bg-black/50 border border-white/5 p-6 rounded-2xl text-white outline-none"></textarea>
                <input id="inAuthor" type="text" placeholder="Author" class="w-full bg-black/50 border border-white/5 p-4 rounded-xl text-white">
                <input id="inTopic" type="text" placeholder="Topic (e.g. Mindset)" class="w-full bg-black/50 border border-white/5 p-4 rounded-xl text-white">
                <div class="flex gap-4 pt-6">
                    <button onclick="document.getElementById('addModal').classList.add('hidden')" class="flex-1 py-4 text-slate-500 font-bold uppercase text-[10px]">Cancel</button>
                    <button onclick="addNew()" class="flex-1 bg-indigo-600 py-4 rounded-2xl font-black uppercase text-xs">Save to Vault</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Database
        let db = JSON.parse(localStorage.getItem('vault_v5')) || [
            { text: "Your income is a mirror of your self-worth.", author: "Arlan Hamilton", topic: "Mindset" },
            { text: "Everything is figureoutable.", author: "Marie Forleo", topic: "Strategy" },
            { text: "Success is not final, failure is not fatal.", author: "Winston Churchill", topic: "Wisdom" }
        ];

        function render(items) {
            const grid = document.getElementById('grid');
            const info = document.getElementById('statusInfo');
            grid.innerHTML = '';
            
            items.forEach((q, i) => {
                grid.innerHTML += `
                    <div class="quote-card p-10 rounded-[2.5rem] relative animate-in fade-in zoom-in duration-300">
                        <div class="text-6xl text-indigo-500/5 absolute top-6 left-6 font-black italic">“</div>
                        <p class="quote-serif text-3xl leading-snug mb-10 italic text-slate-100">${q.text}</p>
                        <div class="flex justify-between items-end">
                            <div>
                                <p class="font-black text-indigo-400 uppercase tracking-widest text-[10px]">${q.author}</p>
                                <span class="inline-block mt-2 text-[8px] bg-indigo-500/10 text-indigo-400 px-2 py-0.5 rounded font-black uppercase tracking-widest">${q.topic}</span>
                            </div>
                            <button onclick="del(${i})" class="text-slate-700 hover:text-rose-500 transition-colors">🗑️</button>
                        </div>
                    </div>
                `;
            });
            info.innerText = `Found ${items.length} pieces of wisdom`;
        }

        function smartSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = db.filter(q => 
                q.text.toLowerCase().includes(query) || 
                q.author.toLowerCase().includes(query) || 
                q.topic.toLowerCase().includes(query)
            );
            render(filtered);
        }

        function addNew() {
            const t = document.getElementById('inQuote').value;
            const a = document.getElementById('inAuthor').value;
            const tp = document.getElementById('inTopic').value;
            if(!t) return;
            db.unshift({ text: t, author: a, topic: tp });
            localStorage.setItem('vault_v5', JSON.stringify(db));
            document.getElementById('addModal').classList.add('hidden');
            render(db);
            // Clear inputs
            document.getElementById('inQuote').value = '';
            document.getElementById('inAuthor').value = '';
            document.getElementById('inTopic').value = '';
        }

        function del(idx) {
            if(confirm('Delete?')) {
                db.splice(idx, 1);
                localStorage.setItem('vault_v5', JSON.stringify(db));
                render(db);
            }
        }

        // Run
        render(db);
    </script>
</body>
</html>
