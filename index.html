<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wisdom Vault | Private Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Crimson+Pro:italic,wght@600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; }
        .quote-card { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(12px); transition: 0.3s; }
        .quote-card:hover { border-color: #6366f1; transform: translateY(-3px); }
        .quote-serif { font-family: 'Crimson Pro', serif; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="vaultApp()" x-init="init()" class="p-6 md:p-12">

    <div class="max-w-5xl mx-auto">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-16 border-b border-white/5 pb-10">
            <div>
                <h1 class="text-3xl font-black tracking-tight text-white uppercase italic">Wisdom<span class="text-indigo-500">Vault</span></h1>
                <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest mt-1">Tiffany's Private Intelligence HQ</p>
            </div>
            <button @click="showAdd = true" class="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-black text-sm hover:bg-indigo-500 transition-all shadow-xl shadow-indigo-600/20 uppercase tracking-widest">+ Add New</button>
        </header>

        <!-- SEARCH -->
        <div class="mb-16">
            <input type="text" x-model="search" placeholder="Search wisdom, authors, or topics..." class="w-full bg-white/5 border border-white/10 rounded-2xl p-6 text-2xl outline-none focus:border-indigo-500 transition-all text-white placeholder-slate-700">
        </div>

        <!-- GRID -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <template x-for="(q, index) in filteredQuotes()" :key="index">
                <div class="quote-card p-10 rounded-[3rem] relative group overflow-hidden">
                    <div class="text-6xl text-indigo-500/5 absolute top-6 left-6 font-black italic">“</div>
                    <p class="quote-serif text-3xl leading-snug mb-10 italic text-slate-100 relative z-10" x-text="q.text"></p>
                    <div class="flex justify-between items-end relative z-10">
                        <div>
                            <p class="font-black text-indigo-400 uppercase tracking-widest text-[10px]" x-text="q.author"></p>
                            <div class="flex gap-2 mt-1">
                                <span class="text-[8px] bg-white/5 px-2 py-0.5 rounded text-slate-500 font-bold uppercase tracking-widest" x-text="q.topic"></span>
                            </div>
                        </div>
                        <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-all">
                             <button @click="deleteQuote(index)" class="h-10 w-10 bg-rose-500/10 text-rose-500 rounded-full flex items-center justify-center font-bold hover:bg-rose-500 hover:text-white transition-all">×</button>
                             <button @click="copyQuote(q.text)" class="h-10 w-10 bg-white/5 text-white rounded-full flex items-center justify-center hover:bg-white/10 transition-all">🔗</button>
                        </div>
                    </div>
                </div>
            </template>
        </div>

    </div>

    <!-- MODAL: ADD QUOTE -->
    <div x-show="showAdd" x-cloak class="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-6 backdrop-blur-xl">
        <div class="bg-slate-900 border border-white/10 p-12 rounded-[3.5rem] max-w-xl w-full shadow-2xl">
            <h2 class="text-3xl font-black mb-8 text-white">Capture Wisdom</h2>
            <div class="space-y-6">
                <textarea x-model="newQ.text" placeholder="What was said?" class="w-full bg-black/50 border border-white/5 rounded-3xl p-8 text-white outline-none h-40 text-lg leading-relaxed focus:border-indigo-500 transition-all"></textarea>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" x-model="newQ.author" placeholder="Author Name" class="w-full bg-black/50 border border-white/5 rounded-2xl p-5 text-white outline-none focus:border-indigo-500 transition-all">
                    <input type="text" x-model="newQ.topic" placeholder="Category" class="w-full bg-black/50 border border-white/5 rounded-2xl p-5 text-white outline-none focus:border-indigo-500 transition-all">
                </div>
                <div class="flex gap-4 pt-6">
                    <button @click="showAdd = false" class="flex-1 py-5 rounded-2xl font-bold text-slate-500 hover:text-white transition-all uppercase tracking-widest text-xs">Discard</button>
                    <button @click="addQuote()" class="flex-1 bg-indigo-600 text-white font-black py-5 rounded-2xl shadow-xl hover:bg-indigo-500 transition-all uppercase tracking-widest text-xs">Save to Vault</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function vaultApp() {
            return {
                showAdd: false,
                search: '',
                newQ: { text: '', author: '', topic: '' },
                quotes: [],

                init() {
                    const saved = localStorage.getItem('tiffany_vault_v3');
                    if(saved) {
                        this.quotes = JSON.parse(saved);
                    } else {
                        this.quotes = [
                            { text: "Your income is a mirror of your self-worth.", author: "Arlan Hamilton", topic: "Mindset" },
                            { text: "Everything is figureoutable.", author: "Marie Forleo", topic: "Strategy" }
                        ];
                    }
                },

                addQuote() {
                    if(!this.newQ.text) return;
                    this.quotes.unshift({...this.newQ});
                    this.save();
                    this.newQ = { text: '', author: '', topic: '' };
                    this.showAdd = false;
                },

                deleteQuote(idx) {
                    if(confirm('Permanently remove from vault?')) {
                        this.quotes.splice(idx, 1);
                        this.save();
                    }
                },

                save() {
                    localStorage.setItem('tiffany_vault_v3', JSON.stringify(this.quotes));
                },

                filteredQuotes() {
                    if(!this.search) return this.quotes;
                    const q = this.search.toLowerCase();
                    return this.quotes.filter(item => 
                        item.text.toLowerCase().includes(q) ||
                        item.author.toLowerCase().includes(q) ||
                        item.topic.toLowerCase().includes(q)
                    );
                },

                copyQuote(text) {
                    navigator.clipboard.writeText(text);
                    alert("Wisdom copied to clipboard!");
                }
            }
        }
    </script>
</body>
</html>
