<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WisdomVault | Private Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Crimson+Pro:italic,wght@600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; }
        .quote-card { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(12px); transition: 0.3s; }
        .quote-serif { font-family: 'Crimson Pro', serif; }
        input { background: #0f172a !important; border: 1px solid #1e293b !important; color: white !important; outline: none !important; }
        input:focus { border-color: #6366f1 !important; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
        .hidden { display: none !important; }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-5xl mx-auto">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-16 border-b border-white/5 pb-10">
            <div>
                <h1 class="text-3xl font-black tracking-tight text-white uppercase italic">WISDOM<span class="text-indigo-500">VAULT</span></h1>
                <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest mt-1">Tiffany's Private Intelligence HQ</p>
            </div>
            <button onclick="toggleModal(true)" class="bg-indigo-600 text-white px-8 py-3 rounded-2xl font-black text-sm hover:bg-indigo-500 shadow-xl">+ ADD NEW</button>
        </header>

        <!-- SEARCH BOX (FIXED) -->
        <div class="mb-16">
            <input type="text" id="searchInput" oninput="filterQuotes()" placeholder="Search wisdom, authors, or topics..." 
                   class="w-full rounded-2xl p-6 text-2xl placeholder-slate-700">
        </div>

        <!-- GRID -->
        <div id="quoteGrid" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Quotes will be injected here -->
        </div>

    </div>

    <!-- MODAL: ADD QUOTE -->
    <div id="addModal" class="hidden fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-6 backdrop-blur-xl">
        <div class="bg-slate-900 border border-white/10 p-12 rounded-[3.5rem] max-w-xl w-full shadow-2xl">
            <h2 class="text-3xl font-black mb-8 text-white">Capture Wisdom</h2>
            <div class="space-y-6">
                <textarea id="newText" placeholder="What was said?" class="w-full bg-black/50 border border-white/5 rounded-3xl p-8 text-white outline-none h-40 text-lg leading-relaxed focus:border-indigo-500"></textarea>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="newAuthor" placeholder="Author Name" class="w-full p-5 rounded-2xl">
                    <input type="text" id="newTopic" placeholder="Category" class="w-full p-5 rounded-2xl">
                </div>
                <div class="flex gap-4 pt-6">
                    <button onclick="toggleModal(false)" class="flex-1 py-5 rounded-2xl font-bold text-slate-500">Discard</button>
                    <button onclick="addQuote()" class="flex-1 bg-indigo-600 text-white font-black py-5 rounded-2xl">Save to Vault</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Database logic
        let quotes = JSON.parse(localStorage.getItem('tiffany_vault_v4')) || [
            { text: "Your income is a mirror of your self-worth.", author: "Arlan Hamilton", topic: "Mindset" },
            { text: "Everything is figureoutable.", author: "Marie Forleo", topic: "Strategy" }
        ];

        function renderQuotes(data) {
            const grid = document.getElementById('quoteGrid');
            grid.innerHTML = '';
            
            data.forEach((q, index) => {
                grid.innerHTML += `
                    <div class="quote-card p-10 rounded-[3rem] relative group overflow-hidden">
                        <div class="text-6xl text-indigo-500/5 absolute top-6 left-6 font-black italic">“</div>
                        <p class="quote-serif text-3xl leading-snug mb-10 italic text-slate-100 relative z-10">${q.text}</p>
                        <div class="flex justify-between items-end relative z-10">
                            <div>
                                <p class="font-black text-indigo-400 uppercase tracking-widest text-[10px]">${q.author}</p>
                                <span class="text-[8px] bg-white/5 px-2 py-0.5 rounded text-slate-500 font-bold uppercase tracking-widest">${q.topic}</span>
                            </div>
                            <button onclick="deleteQuote(${index})" class="h-10 w-10 bg-rose-500/10 text-rose-500 rounded-full flex items-center justify-center font-bold hover:bg-rose-500 hover:text-white transition-all">×</button>
                        </div>
                    </div>
                `;
            });
        }

        function filterQuotes() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = quotes.filter(q => 
                q.text.toLowerCase().includes(term) || 
                q.author.toLowerCase().includes(term) || 
                q.topic.toLowerCase().includes(term)
            );
            renderQuotes(filtered);
        }

        function addQuote() {
            const text = document.getElementById('newText').value;
            const author = document.getElementById('newAuthor').value;
            const topic = document.getElementById('newTopic').value;

            if(!text) return;

            quotes.unshift({ text, author, topic });
            localStorage.setItem('tiffany_vault_v4', JSON.stringify(quotes));
            
            document.getElementById('newText').value = '';
            document.getElementById('newAuthor').value = '';
            document.getElementById('newTopic').value = '';
            
            toggleModal(false);
            renderQuotes(quotes);
        }

        function deleteQuote(idx) {
            if(confirm('Delete this wisdom?')) {
                quotes.splice(idx, 1);
                localStorage.setItem('tiffany_vault_v4', JSON.stringify(quotes));
                renderQuotes(quotes);
            }
        }

        function toggleModal(show) {
            const modal = document.getElementById('addModal');
            if(show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        // Initialize
        renderQuotes(quotes);
    </script>
</body>
</html>
